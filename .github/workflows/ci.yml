name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Installa le dipendenze
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Nomi non definiti e codice morto evidente (pyflakes)
        run: python -m pyflakes main_telethon.py generate_session.py | grep -i "undefined name" && exit 1 || true
      - name: Test
        run: python -m pytest -q
